<!doctype html><html lang="en"><head><title>PanelSpark</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b3a;--sun:#ffd23f;--pink:#ff5d8f;--paper:#fffdf5}
*{box-sizing:border-box}body{margin:0;background:var(--sun);color:var(--ink);font:16px/1.5 system-ui,'Noto Sans Tamil',sans-serif;padding:16px}
main{max-width:860px;margin:auto}h1{font:44px Bangers,Impact,sans-serif;letter-spacing:2px;margin:0 0 4px;text-shadow:3px 3px 0 var(--pink)}
p.sub{margin:0 0 16px}.box{background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px}
label{display:block;font-weight:700;margin:8px 0 2px}input,select,textarea{width:100%;padding:8px;border:2px solid var(--ink);font:inherit;background:#fff}
button{margin-top:10px;padding:10px 18px;border:3px solid var(--ink);background:var(--pink);color:#fff;font:22px Bangers,Impact,sans-serif;letter-spacing:1px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#out{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.panel{background:#fff;border:3px solid var(--ink);padding:10px;position:relative;min-height:170px}
.panel b{font-family:Bangers,Impact,sans-serif;font-size:20px}.bubble{background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:6px 10px;margin-top:8px}
.cap{background:var(--ink);color:#fff;padding:4px 8px;margin-top:8px;font-size:14px}#msg{font-weight:700}
@media print{body{background:#fff}.box{display:none}}
</style></head><body><main>
<h1>PanelSpark</h1><p class="sub">Oru idea kudunga, Gemini panel script ezhuthi tharum.</p><div class="box"><label for="key">Gemini API key (browser-la mattum use aagum)</label><input id="key" type="password" autocomplete="off"></div>
<div class="box"><label for="idea">Story idea</label><textarea id="idea" rows="3">A crow teaches a lazy fox to plan ahead</textarea>
<label for="genre">Genre</label><select id="genre"><option>Comedy</option><option>Moral story</option><option>Thriller</option><option>Adventure</option></select>
<label for="n">Panels</label><input id="n" type="number" min="2" max="8" value="4">
<button id="go">Generate script</button><p id="msg"></p></div>
<div id="out"></div><script>
const $=id=>document.getElementById(id);
$('key').value=sessionStorage.getItem('gkey')||'';
async function gemini(prompt){
  const k=$('key').value.trim(); if(!k) throw new Error('Gemini API key ah first podunga.');
  sessionStorage.setItem('gkey',k);
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error?.message||'API error');
  return JSON.parse(d.candidates[0].content.parts[0].text);
}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$('go').onclick=async()=>{
  $('msg').textContent='Script ezhuthittu irukku...';$('out').innerHTML='';
  try{
    const p=await gemini(`Write a ${$('n').value}-panel ${$('genre').value} comic script for: "${$('idea').value}". Return JSON array of objects with keys scene, dialogue, caption.`);
    $('out').innerHTML=p.map((x,i)=>`<div class="panel"><b>Panel ${i+1}</b><p>${esc(x.scene)}</p><div class="bubble">${esc(x.dialogue)}</div><div class="cap">${esc(x.caption)}</div></div>`).join('');
    $('msg').textContent='';
  }catch(e){$('msg').textContent=e.message}
};
</script></main></body></html>
